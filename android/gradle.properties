# Gradle settings for the whole build. See docs/development/build.md.

# Memory for the Gradle daemon. Robolectric and R8 need room.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.configuration-cache=true

# Never download a JDK. The build uses the installed JDK 21
# (gradle/gradle-daemon-jvm.properties).
org.gradle.java.installations.auto-download=false
