# The rehearsal of restoring and rotating the signing key, with throwaway
# keys only. It never sees the suite key.
#
# Paste this file into the throwaway repository key-rehearsal, as
# .github/workflows/rehearsal.yml. Never into shkriuss.app or
# signing-ceremony.
#
# Steps: docs/development/signing-key-rehearsal.md in shkriuss.app.
# Why: ADR 0013, point 8, and ADR 0037.
#
# - "sign" (part A) builds the Catalog preview of catalog-v0.2.0 and signs
#   it with the throwaway key A that the copy of the ceremony restored into
#   the environment "rehearsal", the way release.yml signs a release.
# - "rotate" (part B) builds the Catalog preview of catalog-v0.3.0. It makes
#   the throwaway keys B and C in the job, rotates A to B, and signs three
#   APKs: rotated (B with the lineage A to B), old key only (A alone) and
#   thief (C with a lineage A to C). B and C are deleted when the job ends.
# - "Draft release" makes a draft release with the APK for Obtainium.

name: Rehearsal
run-name: Rehearsal ${{ inputs.action }}

# Read-only token. Only "Draft release" gets more, and says why.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      action:
        description: sign (part A) or rotate (part B)
        type: choice
        required: true
        options:
          - sign
          - rotate
      old_fingerprint:
        description: SHA-256 of throwaway key A's certificate, from the copy's fingerprint.txt. 64 hex digits, with or without colons.
        type: string
        required: true

defaults:
  run:
    # Stops a step at the first failing command, also inside a pipe.
    shell: bash

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: rehearsal-build
      cancel-in-progress: false
    outputs:
      ref: ${{ steps.inputs.outputs.ref }}
      old_fingerprint: ${{ steps.inputs.outputs.old_fingerprint }}
      apk_sha256: ${{ steps.collect.outputs.apk_sha256 }}
      version: ${{ steps.collect.outputs.version }}
    steps:
      # The same in every job, so a re-run of any one job is checked too.
      - name: Check the inputs
        id: inputs
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          ACTION: ${{ inputs.action }}
          OLD_FINGERPRINT: ${{ inputs.old_fingerprint }}
        run: |
          set -u
          if [ -z "$OWNER" ] || [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Only the repository owner may start or re-run the rehearsal."
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Start the rehearsal on the branch main."
            exit 1
          fi
          case "$ACTION" in
            sign) ref=catalog-v0.2.0 ;;
            rotate) ref=catalog-v0.3.0 ;;
            *) echo "::error::Unknown action."; exit 1 ;;
          esac
          hex="$(tr -d ':[:space:]' <<< "$OLD_FINGERPRINT" | tr 'a-f' 'A-F')"
          if ! [[ "$hex" =~ ^[0-9A-F]{64}$ ]]; then
            echo "::error::old_fingerprint must be 64 hex digits, with or without colons."
            exit 1
          fi
          old="$(sed 's/../&:/g; s/:$//' <<< "$hex")"
          {
            echo "ref=$ref"
            echo "old_fingerprint=$old"
          } >> "$GITHUB_OUTPUT"
          echo "Action $ACTION: build $ref. Expected key A: $old"

      # shkriuss.app is public, so no token is needed. No project code of
      # this repository runs here, only the build of that tag.
      - name: Check out shkriuss.app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shkriuss/shkriuss.app
          ref: ${{ steps.inputs.outputs.ref }}
          persist-credentials: false

      - name: Use JDK 21
        run: |
          if [ -z "${JAVA_HOME_21_X64:-}" ]; then
            echo "::error::This runner has no JDK 21."
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # The same packages as release.yml and pr-preview.yml at both tags.
      - name: Install the Android SDK packages the build pins
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          log="$RUNNER_TEMP/sdkmanager.log"
          set +o pipefail
          if ! yes | "$sdkmanager" --licenses > "$log" 2>&1; then cat "$log"; exit 1; fi
          set -o pipefail
          if ! "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >> "$log" 2>&1; then cat "$log"; exit 1; fi

      - name: Build the unsigned preview APK
        working-directory: android
        run: |
          ./gradlew --no-daemon --console=plain --no-build-cache --no-configuration-cache \
            :app:catalog:assemblePreview

      - name: Check the APK and collect it
        id: collect
        run: |
          set -u
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk_dir="android/app/catalog/build/outputs/apk/preview"
          mapfile -t outputs < <(jq -r '.elements[] | .outputFile, .versionName' "$apk_dir/output-metadata.json")
          if [ "${#outputs[@]}" -ne 2 ] ||
             ! [[ "${outputs[0]}" =~ ^[A-Za-z0-9_.-]+\.apk$ ]] ||
             ! [[ "${outputs[1]}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview$ ]]; then
            echo "::error::Expected exactly one preview APK in $apk_dir."
            exit 1
          fi
          unsigned="$apk_dir/${outputs[0]}"
          version="${outputs[1]}"
          "$build_tools/aapt2" dump badging "$unsigned" > "$RUNNER_TEMP/badging.txt"
          if ! head -n 1 "$RUNNER_TEMP/badging.txt" | grep -q "^package: name='app.shkriuss.catalog.preview' "; then
            echo "::error::The APK is not app.shkriuss.catalog.preview."
            exit 1
          fi
          out="$RUNNER_TEMP/unsigned"
          mkdir -p "$out"
          cp -- "$unsigned" "$out/catalog-preview-unsigned.apk"
          {
            echo "apk_sha256=$(sha256sum "$out/catalog-preview-unsigned.apk" | cut -d ' ' -f 1)"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Built app.shkriuss.catalog.preview $version."

      - name: Upload the unsigned APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}/unsigned/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  sign:
    name: Sign with key A
    needs: build
    if: inputs.action == 'sign'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The environment holds throwaway key A, which the copy of the ceremony
    # restored. It waits for your approval, as "release" does.
    environment: rehearsal
    concurrency:
      group: rehearsal-sign
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check the inputs
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -u
          if [ -z "$OWNER" ] || [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Only the repository owner may start or re-run the rehearsal."
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Start the rehearsal on the branch main."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview$ ]]; then
            echo "::error::Unexpected version from the job Build."
            exit 1
          fi

      - name: Install the Android build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          log="$RUNNER_TEMP/sdkmanager.log"
          set +o pipefail
          if ! yes | "$sdkmanager" --licenses > "$log" 2>&1; then cat "$log"; exit 1; fi
          set -o pipefail
          if ! "$sdkmanager" "build-tools;36.0.0" >> "$log" 2>&1; then cat "$log"; exit 1; fi

      - name: Download the unsigned APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Check the unsigned APK
        env:
          APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -u
          if [ "$(sha256sum "$RUNNER_TEMP/unsigned/catalog-preview-unsigned.apk" | cut -d ' ' -f 1)" != "$APK_SHA256" ]; then
            echo "::error::The downloaded APK is not the one the job Build made."
            exit 1
          fi

      # The same as the step "Sign with the suite key" in release.yml, with
      # the restored throwaway key. Never print a secret, never use set -x.
      - name: Sign with the restored key
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -u
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_KEYSTORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "::error::A secret is missing. The environment rehearsal needs SIGNING_KEYSTORE_B64, SIGNING_KEYSTORE_PASSWORD and SIGNING_KEY_ALIAS. Run restore first."
            exit 1
          fi
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          out="$RUNNER_TEMP/signed"
          mkdir -p "$out"
          umask 077
          key_dir="$(mktemp -d "$RUNNER_TEMP/key.XXXXXXXX")"
          trap 'rm -rf -- "$key_dir"' EXIT
          key_store="$key_dir/rehearsal.p12"
          if ! printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$key_store" 2> /dev/null ||
             [ ! -s "$key_store" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 is not a base64-encoded keystore."
            exit 1
          fi
          if ! "$build_tools/apksigner" sign \
                 --ks "$key_store" --ks-type PKCS12 \
                 --ks-pass env:SIGNING_KEYSTORE_PASSWORD \
                 --key-pass env:SIGNING_KEYSTORE_PASSWORD \
                 --ks-key-alias "$SIGNING_KEY_ALIAS" \
                 --v4-signing-enabled false \
                 --out "$out/catalog-preview-$VERSION-key-a.apk" \
                 "$RUNNER_TEMP/unsigned/catalog-preview-unsigned.apk" < /dev/null; then
            echo "::error::apksigner could not sign. The keystore, its password and the alias in the environment do not belong together."
            exit 1
          fi
          echo "Signed."

      # No secrets from here on.
      - name: Verify the signature and the certificate
        env:
          OLD_FINGERPRINT: ${{ needs.build.outputs.old_fingerprint }}
        run: |
          set -u
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          signed="$RUNNER_TEMP/signed/catalog-preview-$VERSION-key-a.apk"
          verification="$RUNNER_TEMP/verify.txt"
          if ! "$build_tools/apksigner" verify --verbose --print-certs "$signed" > "$verification" 2>&1; then
            cat "$verification"
            echo "::error::apksigner could not verify the signed APK."
            exit 1
          fi
          for line in "Verifies" \
                      "Verified using v3 scheme (APK Signature Scheme v3): true" \
                      "Number of signers: 1"; do
            if ! grep -qxF "$line" "$verification"; then
              cat "$verification"
              echo "::error::apksigner did not report: $line"
              exit 1
            fi
          done
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: \([0-9a-f]\{64\}\)$/\1/p' "$verification")"
          found="$(sed 's/../&:/g; s/:$//' <<< "$cert" | tr 'a-f' 'A-F')"
          if [ "$found" != "$OLD_FINGERPRINT" ]; then
            echo "::error::The restored key is not throwaway key A. Expected $OLD_FINGERPRINT, found $found."
            exit 1
          fi
          {
            echo "## Part A: signed with the restored key A"
            echo
            echo "| Detail | Value |"
            echo "|---|---|"
            echo "| Version | \`$VERSION\` |"
            echo "| Certificate SHA-256 | \`$found\` |"
            echo "| Signed APK SHA-256 | \`$(sha256sum "$signed" | cut -d ' ' -f 1)\` |"
            echo
            echo "The certificate is key A's, from the restored secrets."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Certificate $found is key A's."

      # For the draft release, which Obtainium installs from.
      - name: Upload the signed APK for the draft
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: for-release
          path: ${{ runner.temp }}/signed/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  rotate:
    name: Rotate A to B
    needs: build
    if: inputs.action == 'rotate'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: rehearsal
    concurrency:
      group: rehearsal-rotate
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Check the inputs
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -u
          if [ -z "$OWNER" ] || [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Only the repository owner may start or re-run the rehearsal."
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Start the rehearsal on the branch main."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview$ ]]; then
            echo "::error::Unexpected version from the job Build."
            exit 1
          fi

      - name: Install the Android build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          log="$RUNNER_TEMP/sdkmanager.log"
          set +o pipefail
          if ! yes | "$sdkmanager" --licenses > "$log" 2>&1; then cat "$log"; exit 1; fi
          set -o pipefail
          if ! "$sdkmanager" "build-tools;36.0.0" >> "$log" 2>&1; then cat "$log"; exit 1; fi

      - name: Download the unsigned APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: ${{ runner.temp }}/unsigned

      - name: Check the unsigned APK
        env:
          APK_SHA256: ${{ needs.build.outputs.apk_sha256 }}
        run: |
          set -u
          if [ "$(sha256sum "$RUNNER_TEMP/unsigned/catalog-preview-unsigned.apk" | cut -d ' ' -f 1)" != "$APK_SHA256" ]; then
            echo "::error::The downloaded APK is not the one the job Build made."
            exit 1
          fi

      # The only step that sees key A. Keys B and C are made here and
      # deleted with the folder when the step ends. Never print a secret,
      # never use set -x. Passwords reach the tools as names of variables.
      - name: Rotate and sign
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          OLD_FINGERPRINT: ${{ needs.build.outputs.old_fingerprint }}
        run: |
          set -u
          if [ -z "$SIGNING_KEYSTORE_B64" ] || [ -z "$SIGNING_KEYSTORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ]; then
            echo "::error::A secret is missing. Run restore first."
            exit 1
          fi
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apksigner="$build_tools/apksigner"
          unsigned="$RUNNER_TEMP/unsigned/catalog-preview-unsigned.apk"
          out="$RUNNER_TEMP/signed"
          mkdir -p "$out"
          umask 077
          key_dir="$(mktemp -d "$RUNNER_TEMP/key.XXXXXXXX")"
          trap 'rm -rf -- "$key_dir"' EXIT

          # Key A, from the restored secrets.
          key_a="$key_dir/a.p12"
          if ! printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$key_a" 2> /dev/null || [ ! -s "$key_a" ]; then
            echo "::error::SIGNING_KEYSTORE_B64 is not a base64-encoded keystore."
            exit 1
          fi
          found="$(keytool -list -v -storetype PKCS12 -keystore "$key_a" -storepass:env SIGNING_KEYSTORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" 2> /dev/null |
                   sed -n 's/^[[:space:]]*SHA256: \([0-9A-F:]\{95\}\)$/\1/p' || true)"
          if [ "$found" != "$OLD_FINGERPRINT" ]; then
            echo "::error::The environment does not hold throwaway key A. Expected $OLD_FINGERPRINT, found ${found:-nothing}."
            exit 1
          fi

          # Keys B and C, made here like the preview key in pr-preview.yml.
          KEY_B_PASSWORD="$(openssl rand -hex 32)"
          KEY_C_PASSWORD="$(openssl rand -hex 32)"
          export KEY_B_PASSWORD KEY_C_PASSWORD
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$key_dir/b.p12" \
            -storepass:env KEY_B_PASSWORD -alias rehearsal -keyalg RSA -keysize 4096 -validity 3650 \
            -dname "CN=key-rehearsal B, O=Throwaway key" > /dev/null
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$key_dir/c.p12" \
            -storepass:env KEY_C_PASSWORD -alias thief -keyalg RSA -keysize 4096 -validity 3650 \
            -dname "CN=key-rehearsal C thief, O=Throwaway key" > /dev/null

          # The lineage A to B. Key A keeps only the right to hand over the
          # installed app and its data (ADR 0037).
          "$apksigner" rotate --out "$out/lineage-a-to-b.bin" \
            --old-signer --ks "$key_a" --ks-type PKCS12 --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:SIGNING_KEYSTORE_PASSWORD --key-pass env:SIGNING_KEYSTORE_PASSWORD \
              --set-installed-data true --set-shared-uid false --set-permission false \
              --set-rollback false --set-auth false \
            --new-signer --ks "$key_dir/b.p12" --ks-type PKCS12 --ks-key-alias rehearsal \
              --ks-pass env:KEY_B_PASSWORD --key-pass env:KEY_B_PASSWORD < /dev/null

          # Rotated: key B and the lineage only, as a release after a
          # rotation signs. v1 and v2 are off by name: with a lineage,
          # apksigner otherwise asks for the oldest key too.
          "$apksigner" sign --ks "$key_dir/b.p12" --ks-type PKCS12 --ks-key-alias rehearsal \
            --ks-pass env:KEY_B_PASSWORD --key-pass env:KEY_B_PASSWORD \
            --lineage "$out/lineage-a-to-b.bin" --rotation-min-sdk-version 33 \
            --v1-signing-enabled false --v2-signing-enabled false --v4-signing-enabled false \
            --out "$out/catalog-preview-$VERSION-rotated.apk" "$unsigned" < /dev/null

          # Old key only: key A alone. Android must refuse it over the
          # rotated app.
          "$apksigner" sign --ks "$key_a" --ks-type PKCS12 --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_KEYSTORE_PASSWORD --key-pass env:SIGNING_KEYSTORE_PASSWORD \
            --v4-signing-enabled false \
            --out "$out/catalog-preview-$VERSION-old-key-only.apk" "$unsigned" < /dev/null

          # Thief: someone who holds key A makes a lineage of their own, to
          # key C. Android must refuse it over the rotated app too.
          "$apksigner" rotate --out "$key_dir/lineage-a-to-c.bin" \
            --old-signer --ks "$key_a" --ks-type PKCS12 --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --ks-pass env:SIGNING_KEYSTORE_PASSWORD --key-pass env:SIGNING_KEYSTORE_PASSWORD \
            --new-signer --ks "$key_dir/c.p12" --ks-type PKCS12 --ks-key-alias thief \
              --ks-pass env:KEY_C_PASSWORD --key-pass env:KEY_C_PASSWORD < /dev/null
          "$apksigner" sign --ks "$key_dir/c.p12" --ks-type PKCS12 --ks-key-alias thief \
            --ks-pass env:KEY_C_PASSWORD --key-pass env:KEY_C_PASSWORD \
            --lineage "$key_dir/lineage-a-to-c.bin" --rotation-min-sdk-version 33 \
            --v1-signing-enabled false --v2-signing-enabled false --v4-signing-enabled false \
            --out "$out/catalog-preview-$VERSION-thief.apk" "$unsigned" < /dev/null

          # The lineage holds only certificates and signatures. It is
          # public, like every rotated APK, which carries it.
          base64 -w 76 "$out/lineage-a-to-b.bin" > "$out/lineage-a-to-b.txt"
          rm -f -- "$out/lineage-a-to-b.bin"
          echo "Rotated and signed. Keys B and C are deleted when this step ends."

      # No secrets from here on.
      - name: Verify the three APKs
        env:
          OLD_FINGERPRINT: ${{ needs.build.outputs.old_fingerprint }}
        run: |
          set -u
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apksigner="$build_tools/apksigner"
          out="$RUNNER_TEMP/signed"
          colons() { sed 's/../&:/g; s/:$//' <<< "$1" | tr 'a-f' 'A-F'; }

          # Prints the signer's certificate SHA-256 with colons, or fails.
          verify() {
            local apk="$1" report="$RUNNER_TEMP/verify-$(basename "$1").txt" line
            if ! "$apksigner" verify --verbose --print-certs "$apk" > "$report" 2>&1; then
              cat "$report" >&2
              echo "::error::apksigner could not verify $(basename "$apk")." >&2
              return 1
            fi
            for line in "Verifies" \
                        "Verified using v3 scheme (APK Signature Scheme v3): true" \
                        "Verified using v3.1 scheme (APK Signature Scheme v3.1): false" \
                        "Number of signers: 1"; do
              if ! grep -qxF "$line" "$report"; then
                cat "$report" >&2
                echo "::error::For $(basename "$apk"), apksigner did not report: $line" >&2
                return 1
              fi
            done
            colons "$(sed -n 's/^Signer #1 certificate SHA-256 digest: \([0-9a-f]\{64\}\)$/\1/p' "$report")"
          }

          # Prints "SHA-256 installed-data shared-uid permission rollback auth"
          # for each signer of an APK's lineage, the oldest first.
          lineage() {
            "$apksigner" lineage --in "$1" --print-certs | awk '
              /^Signer #[0-9]+ in lineage certificate SHA-256 digest:/ { if (cert != "") print cert, caps; cert = $NF; caps = "" }
              /^Has .* capability/ { caps = caps " " $NF }
              END { if (cert != "") print cert, caps }'
          }

          rotated="$out/catalog-preview-$VERSION-rotated.apk"
          old_only="$out/catalog-preview-$VERSION-old-key-only.apk"
          thief="$out/catalog-preview-$VERSION-thief.apk"

          cert_b="$(verify "$rotated")"
          cert_a="$(verify "$old_only")"
          cert_c="$(verify "$thief")"
          if [ "$cert_a" != "$OLD_FINGERPRINT" ]; then
            echo "::error::The old-key-only APK is not signed with key A."
            exit 1
          fi
          if [ "$cert_b" = "$cert_a" ] || [ "$cert_c" = "$cert_a" ] || [ "$cert_b" = "$cert_c" ]; then
            echo "::error::Keys A, B and C must all differ."
            exit 1
          fi

          mapfile -t chain < <(lineage "$rotated")
          if [ "${#chain[@]}" -ne 2 ]; then
            echo "::error::The rotated APK's lineage must hold two certificates, A then B."
            exit 1
          fi
          read -r first_cert first_caps <<< "${chain[0]}"
          read -r second_cert _ <<< "${chain[1]}"
          if [ "$(colons "$first_cert")" != "$cert_a" ] || [ "$(colons "$second_cert")" != "$cert_b" ]; then
            echo "::error::The rotated APK's lineage is not A then B."
            exit 1
          fi
          # installed data, shared UID, permission, rollback, auth.
          if [ "$first_caps" != "true false false false false" ]; then
            echo "::error::Key A's rights in the lineage are: $first_caps. Expected: installed data only."
            exit 1
          fi
          mapfile -t thief_chain < <(lineage "$thief")
          read -r thief_first _ <<< "${thief_chain[0]}"
          if [ "${#thief_chain[@]}" -ne 2 ] || [ "$(colons "$thief_first")" != "$cert_a" ]; then
            echo "::error::The thief APK's lineage must start with key A."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/for-release"
          cp -- "$rotated" "$RUNNER_TEMP/for-release/"
          {
            echo "## Part B: rotated from A to B"
            echo
            echo "| Key | Certificate SHA-256 |"
            echo "|---|---|"
            echo "| A, old (restored) | \`$cert_a\` |"
            echo "| B, new (made in the job, deleted) | \`$cert_b\` |"
            echo "| C, thief (made in the job, deleted) | \`$cert_c\` |"
            echo
            echo "All three APKs: scheme v3, no v3.1 block, one signer."
            echo
            echo "Lineage of the rotated APK, the oldest first:"
            echo
            echo "| Certificate | Installed data, shared UID, permission, rollback, auth |"
            echo "|---|---|"
            for entry in "${chain[@]}"; do
              read -r cert caps <<< "$entry"
              echo "| \`$(colons "$cert")\` | $caps |"
            done
            echo
            echo "| File | For |"
            echo "|---|---|"
            echo "| \`catalog-preview-$VERSION-rotated.apk\` | The draft release, then Obtainium |"
            echo "| \`catalog-preview-$VERSION-old-key-only.apk\` | Install over the rotated app: Android must refuse it |"
            echo "| \`catalog-preview-$VERSION-thief.apk\` | Install over the rotated app: Android must refuse it |"
            echo "| \`lineage-a-to-b.txt\` | The lineage, base64. Public. |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Verified."

      # Each APK as it is, not zipped, so the phone can install it straight
      # from the download.
      - name: Upload the old-key-only APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          name: catalog-preview-${{ env.VERSION }}-old-key-only.apk
          path: ${{ runner.temp }}/signed/catalog-preview-${{ env.VERSION }}-old-key-only.apk
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload the thief APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          name: catalog-preview-${{ env.VERSION }}-thief.apk
          path: ${{ runner.temp }}/signed/catalog-preview-${{ env.VERSION }}-thief.apk
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload the lineage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: false
          name: lineage-a-to-b.txt
          path: ${{ runner.temp }}/signed/lineage-a-to-b.txt
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Upload the rotated APK for the draft
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: for-release
          path: ${{ runner.temp }}/for-release/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  draft:
    name: Draft release
    needs: [build, sign, rotate]
    # Runs after whichever of the two signing jobs ran.
    if: always() && needs.build.result == 'success' && (needs.sign.result == 'success' || needs.rotate.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # To create the draft release and upload its APK. Nothing else.
      contents: write
    concurrency:
      group: rehearsal-draft
      cancel-in-progress: false
    env:
      VERSION: ${{ needs.build.outputs.version }}
      ACTION: ${{ inputs.action }}
    steps:
      - name: Check the inputs
        env:
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -u
          if [ -z "$OWNER" ] || [ "$ACTOR" != "$OWNER" ] || [ "$TRIGGERING_ACTOR" != "$OWNER" ]; then
            echo "::error::Only the repository owner may start or re-run the rehearsal."
            exit 1
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Start the rehearsal on the branch main."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview$ ]]; then
            echo "::error::Unexpected version from the job Build."
            exit 1
          fi

      - name: Download the APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: for-release
          path: ${{ runner.temp }}/for-release

      # A draft has no tag. Publishing it creates the tag v<version>, which
      # Obtainium reads as the version.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -u
          case "$ACTION" in
            sign) file="catalog-preview-$VERSION-key-a.apk"; what="Signed with throwaway key A, restored from its backup (part A)." ;;
            rotate) file="catalog-preview-$VERSION-rotated.apk"; what="Signed with throwaway key B and the lineage A to B (part B)." ;;
            *) echo "::error::Unknown action."; exit 1 ;;
          esac
          apk="$RUNNER_TEMP/for-release/$file"
          if [ ! -s "$apk" ]; then
            echo "::error::$file is missing."
            exit 1
          fi
          tag="v$VERSION"
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name')"
          if grep -qxF "$tag" <<< "$tags"; then
            echo "::error::A release or draft for $tag already exists. Delete it first."
            exit 1
          fi
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Rehearsal only. Catalog preview $VERSION (\`app.shkriuss.catalog.preview\`)."
            echo
            echo "$what It was never signed with the suite key."
          } > "$notes"
          url="$(gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes" "$apk")"
          echo "Draft: $url"
          {
            echo "## Draft release $tag"
            echo
            echo "Open the Releases page, tap the draft $tag, tap the pencil, then Publish release."
          } >> "$GITHUB_STEP_SUMMARY"
