# Shared setup for every workflow: pnpm, Node.js (version from .node-version)
# and dependencies from the lockfile (unless install is "false"). Actions are
# pinned to exact commits; Dependabot keeps them up to date.
name: Setup
description: Install pnpm, Node.js and dependencies
inputs:
  cache:
    description: '"false" for a clean install that does not use or save the shared package cache (the deploy job)'
    required: false
    default: 'true'
  install:
    description: '"false" to install only pnpm and Node.js, not the packages (the dependency audit, which never installs a pull request''s packages)'
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install pnpm (version from package.json)
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        cache: ${{ inputs.cache == 'true' }}

    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        package-manager-cache: false

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
