# "Claude" button: asks Claude Code to fix or change something, from a phone.
# GitHub → Actions → Claude → Run workflow → write what you want, and the
# number of the pull request to work on (or nothing, for a new branch).
# Claude works with the repository's rules (CLAUDE.md): it reads the code and
# what CI said, runs the quick checks (formatting, lint, types, unit tests,
# build, size and CSP) and pushes: to the pull request's branch, or to a new
# branch with a link to open the pull request. Its summary is on the run's
# page. CI checks everything it pushes, and nothing reaches the live sites
# until you merge. It's paid for by the Claude API key in the `claude`
# environment.
# Docs: docs/claude-in-github.md (set-up, costs, limits, turning it off)
name: Claude

on:
  workflow_dispatch:
    inputs:
      request:
        description: 'What should Claude do? In plain words, as in a chat (e.g. "CI failed here: fix it")'
        required: true
        type: string
      pull_request:
        description: 'Number of the pull request to work on (e.g. 96). Leave empty to start a new branch from main'
        required: false
        type: string
        default: ''

# Jobs get no permissions unless they ask for them below.
permissions: {}

# One run at a time: a second run waits for the first to finish.
concurrency:
  group: claude
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  claude:
    name: Claude
    runs-on: ubuntu-latest
    # The API key is a secret of this environment, which only main can use,
    # so a branch can't change this workflow to reach it.
    environment: claude
    # A run stops here at the latest; --max-turns below usually ends it first.
    timeout-minutes: 45
    permissions:
      contents: read # check out the code
      pull-requests: read # read the pull request
      actions: read # read CI's results and logs
      id-token: write # sign in as the Claude GitHub App, which pushes Claude's commits
    steps:
      # Main's own code first: the set-up below is never a branch's.
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No shared package cache: this job runs a branch's code, so it must not
      # write a cache that CI on main (which builds what's deployed) reads.
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cache: 'false'

      # Read only, so "pnpm build" doesn't download Grammar's model again.
      - name: Grammar's Deep check model, from the cache
        uses: ./.github/actions/deep-check-model

      - name: Switch to the pull request's branch, and collect what CI said
        if: inputs.pull_request != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pull_request }}
          OUT: ${{ runner.temp }}/for-claude
        run: |
          set -euo pipefail
          if ! [[ "$PR" =~ ^[0-9]{1,7}$ ]]; then
            echo "::error title=Not a number::Write only the pull request's number, like 96."
            exit 1
          fi
          mkdir -p "$OUT"
          gh pr view "$PR" --json number,title,body,url,state,headRefName,isCrossRepository > "$OUT/pull-request.json"
          if [[ "$(jq -r .state "$OUT/pull-request.json")" != OPEN ]]; then
            echo "::error title=Not open::Pull request $PR is already merged or closed."
            exit 1
          fi
          if [[ "$(jq -r .isCrossRepository "$OUT/pull-request.json")" != false ]]; then
            echo "::error title=Someone else's copy::Pull request $PR comes from another person's copy of the repository. Claude only works on this repository's own branches."
            exit 1
          fi
          branch=$(jq -r .headRefName "$OUT/pull-request.json")
          git fetch --no-tags --depth=50 origin "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          git switch --create "$branch" "refs/remotes/origin/${branch}"
          # So a plain "git push" goes back to the pull request's branch.
          git config "branch.${branch}.remote" origin
          git config "branch.${branch}.merge" "refs/heads/${branch}"
          # CI's newest run on the branch and, if it failed, the log of what failed.
          gh run list --workflow ci.yml --branch "$branch" --limit 1 \
            --json databaseId,status,conclusion,url,headSha > "$OUT/ci-run.json"
          run_id=$(jq -r '.[0].databaseId // empty' "$OUT/ci-run.json")
          if [[ -n "$run_id" && "$(jq -r '.[0].conclusion' "$OUT/ci-run.json")" == failure ]]; then
            gh run view "$run_id" --log-failed | tail -c 200000 > "$OUT/ci-failed.log" || true
          fi

      # The branch's own packages, in case it changed them (no secrets here).
      - name: Install the pull request's packages
        if: inputs.pull_request != ''
        run: pnpm install --frozen-lockfile

      - name: Claude
        uses: anthropics/claude-code-action@16f9f71ab9c490faf367f94dd294897edc25be33 # v1.0.261
        env:
          # The commands Claude runs (pnpm test, …) don't see the API key or tokens.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Naming these limits the app's token to them (commits, pull requests,
          # issues, reading CI): without the "workflows" permission it can't
          # push a change to a workflow.
          additional_permissions: |
            actions: read
          # Claude's summary on the run's page.
          display_report: 'true'
          prompt: |
            The owner asked for this, from GitHub's "Run workflow" form:

            ${{ inputs.request }}

            Pull request: ${{ inputs.pull_request || 'none' }}

            How to work here:
            - With a pull request, you're on its branch already. Its description, CI's newest run on it, and the log of what failed (when CI failed) are in ${{ runner.temp }}/for-claude/. Commit on this branch and push with git push, never forcing.
            - With none, make a branch from main named claude/ plus a few words, commit, push it, and give the link https://github.com/${{ github.repository }}/compare/main...BRANCH?expand=1 (with the branch's name) so the owner can open the pull request.
            - Follow CLAUDE.md. Before pushing, run the checks that fit the change: pnpm format:check, pnpm lint, pnpm typecheck, pnpm test, pnpm build, pnpm check:dist. The browser tests (pnpm test:e2e) can't run here: CI runs them on every push.
            - Keep the change small and about what was asked. If the request is unclear, or too big for one small change, change nothing and say what you need.
            - End with a short summary in plain language (the owner is a beginner, on a phone): what you changed, what you checked, and anything the owner has to do. It's shown on this run's page.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git switch:*),Bash(git push:*),Bash(pnpm format:*),Bash(pnpm lint),Bash(pnpm typecheck),Bash(pnpm test:*),Bash(pnpm build),Bash(pnpm check:dist),Bash(pnpm exec vitest run:*)"
            --disallowedTools "Bash(git push --force:*),Bash(git push -f:*),Bash(git push --force-with-lease:*)"
