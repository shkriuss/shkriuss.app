# Sends the libraries that ship in each app to GitHub's dependency graph,
# so that Dependabot alerts can name a library with a known vulnerability.
# GitHub cannot read Gradle files by itself. Its automatic dependency
# submission stays off: for Gradle it builds with dependency verification
# turned off, and with a plugin from the Gradle Plugin Portal.
# How it works, and what the owner turns on: docs/development/ci.md,
# "Dependency graph". Why: docs/security/threat-model.md, point 4 under
# "Found while writing this page".

name: Dependency graph

# Read-only token. Only the job "Submit" gets more, and says why.
permissions:
  contents: read

# Never on pull requests.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "tools/dependency-graph/**"
      - ".github/workflows/dependency-graph.yml"
  workflow_dispatch:

defaults:
  run:
    # Stops a step at the first failing command, also inside a pipe.
    shell: bash

jobs:
  list:
    name: List
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Runs Gradle and the snapshot script, so it gets no write token.
    permissions:
      contents: read
    # A newer push to main makes an older list useless.
    concurrency:
      group: dependency-graph-list
      cancel-in-progress: true
    outputs:
      snapshot_sha256: ${{ steps.snapshot.outputs.sha256 }}
    steps:
      - name: Check the branch
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Run this workflow on the branch main."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use JDK 21
        run: |
          # GitHub's Ubuntu runners come with JDK 21 installed.
          if [ -z "${JAVA_HOME_21_X64:-}" ]; then
            echo "::error::This runner has no JDK 21."
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # Keep these in step with build-logic (ShkBuild.kt), ci.yml and the
      # cloud setup script in docs/development/cloud-environment.md.
      - name: Install the Android SDK packages the build pins
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          log="$RUNNER_TEMP/sdkmanager.log"
          set +o pipefail
          if ! yes | "$sdkmanager" --licenses > "$log" 2>&1; then cat "$log"; exit 1; fi
          set -o pipefail
          if ! "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >> "$log" 2>&1; then cat "$log"; exit 1; fi

      - name: Test the snapshot script
        run: python3 -B -m unittest discover -s tools/dependency-graph -t tools/dependency-graph

      # Dependency verification stays on, as in every build of this
      # project: Gradle checks every file it downloads against
      # android/gradle/verification-metadata.xml. No caches.
      - name: List the release runtime class path of each app
        working-directory: android
        run: |
          set -u
          out="$RUNNER_TEMP/reports"
          mkdir -p "$out"
          for file in app/*/build.gradle.kts; do
            app="${file#app/}"
            app="${app%/build.gradle.kts}"
            if ! [[ "$app" =~ ^[a-z][a-z0-9]*$ ]]; then
              echo "::error::Unexpected app folder: android/app/$app"
              exit 1
            fi
            ./gradlew --no-daemon --console=plain --no-build-cache --no-configuration-cache \
              ":app:$app:dependencies" --configuration releaseRuntimeClasspath > "$out/$app.txt"
          done

      - name: Write the snapshot
        id: snapshot
        run: |
          set -u
          out="$RUNNER_TEMP/snapshot"
          mkdir -p "$out"
          reports=()
          for report in "$RUNNER_TEMP"/reports/*.txt; do
            reports+=("$(basename "$report" .txt)=$report")
          done
          python3 -B tools/dependency-graph/snapshot.py \
            --sha "$GITHUB_SHA" --ref "$GITHUB_REF" --run-id "$GITHUB_RUN_ID" \
            --out "$out/snapshot.json" "${reports[@]}"
          echo "sha256=$(sha256sum "$out/snapshot.json" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload the snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-snapshot
          path: ${{ runner.temp }}/snapshot/snapshot.json
          if-no-files-found: error
          retention-days: 7

  submit:
    name: Submit
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # Only to send the snapshot to the dependency graph. This job checks
      # out nothing and runs no code from the repository or its build.
      contents: write
    # Runs wait for each other, so a send never stops half-way.
    concurrency:
      group: dependency-graph-submit
      cancel-in-progress: false
    steps:
      - name: Download the snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-snapshot
          path: ${{ runner.temp }}/snapshot

      # The file must be the one that the job "List" wrote, for this commit.
      - name: Check the snapshot
        env:
          EXPECTED_SHA256: ${{ needs.list.outputs.snapshot_sha256 }}
        run: |
          set -u
          file="$RUNNER_TEMP/snapshot/snapshot.json"
          actual="$(sha256sum "$file" | cut -d ' ' -f 1)"
          if [ -z "$EXPECTED_SHA256" ] || [ "$actual" != "$EXPECTED_SHA256" ]; then
            echo "::error::The snapshot is not the one the job List wrote."
            exit 1
          fi
          if ! jq -e --arg sha "$GITHUB_SHA" '
              .version == 0 and .sha == $sha and .ref == "refs/heads/main"
              and (.manifests | type == "object" and length > 0)' "$file" > /dev/null; then
            echo "::error::The snapshot does not have the expected form."
            exit 1
          fi

      - name: Send the snapshot to the dependency graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          answer="$(gh api --method POST "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" \
            --input "$RUNNER_TEMP/snapshot/snapshot.json" --jq '"\(.result): \(.message)"')"
          echo "GitHub answered: $answer"
          {
            echo "## Dependency graph"
            echo
            echo "GitHub answered: $answer"
            echo
            echo "Alerts: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/security/dependabot"
          } >> "$GITHUB_STEP_SUMMARY"
