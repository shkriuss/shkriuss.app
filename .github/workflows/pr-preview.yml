# Preview APKs and screenshots for every pull request.
# How to get them onto a phone: docs/development/test-a-pull-request.md.
# What each job does, and why: docs/development/ci.md.

name: PR preview

# Read-only token. No job in this workflow needs more. Uploads use the
# run's own artifact storage, not this token.
permissions:
  contents: read

on:
  pull_request:

defaults:
  run:
    # Stops a step at the first failing command, also inside a pipe.
    shell: bash

jobs:
  changes:
    name: Find apps and screenshots
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: pr-preview-changes-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The test merge commit and its first parent, the tip of the base
          # branch. Their difference is what the pull request changes.
          fetch-depth: 2

      # Runs no project code. File names come from the pull request, so they
      # are read as data only: matched against fixed patterns, never run.
      - name: Find what the pull request changes
        id: find
        run: |
          set -u
          if ! git rev-parse --quiet --verify 'HEAD^1' > /dev/null; then
            echo "::error::The base commit was not fetched."
            exit 1
          fi

          # Every app: a folder in android/app/ with a build file.
          declare -A is_app=()
          for build_file in android/app/*/build.gradle.kts; do
            [ -e "$build_file" ] || continue
            name="${build_file#android/app/}"
            name="${name%/build.gradle.kts}"
            if [[ "$name" =~ ^[a-z][a-z0-9]*$ ]]; then is_app["$name"]=1; fi
          done

          # Which apps the pull request touches:
          # - android/app/<app>/ touches that app.
          # - android/feature/<app>/ touches that app.
          # - Anything else in android/ (core, build-logic, Gradle files) can
          #   change every app, and so can a change to this workflow.
          # - Everything else (docs, other workflows) touches no app.
          # Changed screenshot images are copied out, to be uploaded.
          declare -A touched=()
          every_app=false
          screenshots=0
          stage="$RUNNER_TEMP/screenshots"
          mkdir -p "$stage"
          image_pattern='^android/(([a-z0-9_-]+/)+)src/test/screenshots/(([A-Za-z0-9_-]+/)*[A-Za-z0-9_.-]+\.png)$'
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            case "$path" in
              android/app/*/* | android/feature/*/*)
                rest="${path#android/*/}"
                name="${rest%%/*}"
                if [[ "$name" =~ ^[a-z][a-z0-9]*$ ]] && [ -n "${is_app[$name]:-}" ]; then
                  touched["$name"]=1
                elif [[ "$path" == android/feature/* ]]; then
                  every_app=true
                fi
                ;;
              android/* | .github/workflows/pr-preview.yml)
                every_app=true
                ;;
            esac
            if [ "$status" != D ] && [[ "$path" =~ $image_pattern ]] &&
               [ -f "$path" ] && [ ! -L "$path" ]; then
              module="${BASH_REMATCH[1]%/}"
              image="${BASH_REMATCH[3]}"
              mkdir -p "$(dirname "$stage/$module/$image")"
              cp -- "$path" "$stage/$module/$image"
              screenshots=$((screenshots + 1))
            fi
          done < <(git diff -z --name-status --no-renames 'HEAD^1' HEAD)

          if [ "$every_app" = true ]; then
            apps=("${!is_app[@]}")
          else
            apps=("${!touched[@]}")
          fi
          apps_json="$(jq -nc '$ARGS.positional | sort' --args "${apps[@]}")"
          echo "Apps: $apps_json"
          echo "Screenshot images new or changed: $screenshots"
          echo "apps=$apps_json" >> "$GITHUB_OUTPUT"
          echo "screenshots=$screenshots" >> "$GITHUB_OUTPUT"

      - name: Upload the new and changed screenshots
        id: upload
        if: steps.find.outputs.screenshots != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-pr${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/screenshots/
          if-no-files-found: error
          overwrite: true

      - name: Write the summary
        env:
          APPS: ${{ steps.find.outputs.apps }}
          SCREENSHOTS: ${{ steps.find.outputs.screenshots }}
          SCREENSHOTS_URL: ${{ steps.upload.outputs.artifact-url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -u
          guide="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/development/test-a-pull-request.md"
          # ["catalog","water"] becomes "Catalog, Water".
          names="$(jq -r 'map((.[0:1] | ascii_upcase) + .[1:]) | join(", ")' <<< "$APPS")"
          {
            echo "## Preview of pull request $PR_NUMBER"
            echo
            if [ -n "$names" ]; then
              echo "Apps with a preview APK: $names. Each has its own section on this page, with the link to tap."
            else
              echo "This pull request changes no app, so there is no preview APK."
            fi
            echo
            echo "### Screenshots"
            echo
            if [ "$SCREENSHOTS" = 0 ]; then
              echo "No screenshot image is new or changed."
            elif [ "$SCREENSHOTS" = 1 ]; then
              echo "1 screenshot image is new or changed."
            else
              echo "$SCREENSHOTS screenshot images are new or changed."
              echo "Tap [screenshots-pr$PR_NUMBER.zip]($SCREENSHOTS_URL) to download them, then open the zip in the **Files** app."
            fi
            echo
            echo "All steps: [Test a pull request on a phone]($guide)."
          } >> "$GITHUB_STEP_SUMMARY"

  preview:
    name: Preview (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    concurrency:
      group: pr-preview-${{ github.event.pull_request.number }}-${{ matrix.app }}
      cancel-in-progress: true
    env:
      APP: ${{ matrix.app }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use JDK 21
        run: |
          # GitHub's Ubuntu runners come with JDK 21 installed.
          if [ -z "${JAVA_HOME_21_X64:-}" ]; then
            echo "::error::This runner has no JDK 21."
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # Keep these in step with build-logic (ShkBuild.kt) and the cloud setup
      # script in docs/development/cloud-environment.md.
      - name: Install the Android SDK packages the build pins
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          log="$RUNNER_TEMP/sdkmanager.log"
          set +o pipefail
          if ! yes | "$sdkmanager" --licenses > "$log" 2>&1; then cat "$log"; exit 1; fi
          set -o pipefail
          if ! "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >> "$log" 2>&1; then cat "$log"; exit 1; fi

      # Restore only. Only CI on main saves this cache (see ci.yml).
      - name: Restore Gradle downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/verification-metadata.xml') }}

      # The two rules checks also run as part of assemblePreview. Naming them
      # makes the build fail if either is ever removed.
      - name: Build the preview APK
        working-directory: android
        run: |
          set -u
          if ! [[ "$APP" =~ ^[a-z][a-z0-9]*$ ]]; then
            echo "::error::Unexpected app name."
            exit 1
          fi
          ./gradlew --no-daemon --console=plain \
            ":app:$APP:assemblePreview" \
            ":app:$APP:checkPreviewApkRules" \
            ":app:$APP:checkPreviewGraphicsPathUse"

      # The key is made here, used once and deleted. It is not the release
      # key, so a preview can never replace or update a real app. Every run
      # makes a new key, so a preview cannot update an older preview either.
      - name: Sign with a throwaway key
        id: sign
        run: |
          set -u
          if ! [[ "$APP" =~ ^[a-z][a-z0-9]*$ && "$PR_NUMBER" =~ ^[0-9]+$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected app name, pull request number or commit."
            exit 1
          fi
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk_dir="android/app/$APP/build/outputs/apk/preview"

          # The build lists its output in output-metadata.json. Check every
          # value read from it before using it.
          metadata="$apk_dir/output-metadata.json"
          app_id="$(jq -r '.applicationId' "$metadata")"
          mapfile -t outputs < <(jq -r '.elements[] | .outputFile, .versionName' "$metadata")
          if [ "${#outputs[@]}" -ne 2 ] ||
             ! [[ "${outputs[0]}" =~ ^[A-Za-z0-9_.-]+\.apk$ ]] ||
             ! [[ "${outputs[1]}" =~ ^[A-Za-z0-9_.+-]+$ ]] ||
             ! [[ "$app_id" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "::error::Expected exactly one preview APK in $apk_dir."
            exit 1
          fi
          unsigned="$apk_dir/${outputs[0]}"
          version="${outputs[1]}"

          out_dir="$RUNNER_TEMP/apk"
          mkdir -p "$out_dir"
          name="$APP-preview-pr$PR_NUMBER-${HEAD_SHA:0:7}.apk"
          signed="$out_dir/$name"

          key_store="$RUNNER_TEMP/throwaway-key.p12"
          trap 'rm -f "$key_store"' EXIT
          THROWAWAY_PASSWORD="$(openssl rand -hex 32)"
          export THROWAWAY_PASSWORD
          keytool -genkeypair -noprompt \
            -storetype PKCS12 -keystore "$key_store" -storepass:env THROWAWAY_PASSWORD \
            -alias preview -keyalg RSA -keysize 4096 -validity 3650 \
            -dname "CN=shkriuss.app preview, O=Throwaway key"
          "$build_tools/apksigner" sign \
            --ks "$key_store" --ks-pass env:THROWAWAY_PASSWORD --ks-key-alias preview \
            --out "$signed" "$unsigned"
          rm -f "$key_store"

          verification="$RUNNER_TEMP/apksigner-verify.txt"
          "$build_tools/apksigner" verify --verbose --print-certs "$signed" > "$verification"
          cat "$verification"
          grep -q '^Verified using v2 scheme (APK Signature Scheme v2): true$' "$verification"
          "$build_tools/zipalign" -c -P 16 4 "$signed"
          cert_sha256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: \([0-9a-f]\{64\}\)$/\1/p' "$verification")"
          apk_sha256="$(sha256sum "$signed" | cut -d ' ' -f 1)"

          {
            echo "name=$name"
            echo "path=$signed"
            echo "app_id=$app_id"
            echo "version=$version"
            echo "apk_sha256=$apk_sha256"
            echo "cert_sha256=$cert_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the APK
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The APK itself, not a zip, so the phone can install it straight
          # from the download.
          archive: false
          # Without a zip, the file name is the artifact name. Giving the same
          # name here lets a re-run replace the earlier upload.
          name: ${{ steps.sign.outputs.name }}
          path: ${{ steps.sign.outputs.path }}
          if-no-files-found: error
          overwrite: true

      - name: Write the summary
        env:
          APK_NAME: ${{ steps.sign.outputs.name }}
          APK_URL: ${{ steps.upload.outputs.artifact-url }}
          APP_ID: ${{ steps.sign.outputs.app_id }}
          VERSION: ${{ steps.sign.outputs.version }}
          APK_SHA256: ${{ steps.sign.outputs.apk_sha256 }}
          CERT_SHA256: ${{ steps.sign.outputs.cert_sha256 }}
        run: |
          set -u
          label="${APP^} preview"
          {
            echo "## $label"
            echo
            echo "1. Tap [$APK_NAME]($APK_URL). Your browser downloads the APK."
            echo "2. When the download is done, tap **Open**. Or open the **Files** app, tap **Downloads** and tap the file."
            echo "3. If Android asks, allow your browser to install apps, then go back."
            echo "4. Tap **Install**."
            echo
            echo "If Android says the app was not installed, uninstall **$label** first, then try again."
            echo "Every preview is signed with a new throwaway key, so it cannot update an older preview."
            echo
            echo "| Detail | Value |"
            echo "|---|---|"
            echo "| App ID | \`$APP_ID\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Built from | Pull request $PR_NUMBER at commit \`${HEAD_SHA:0:7}\`, merged with its base branch |"
            echo "| APK SHA-256 | \`$APK_SHA256\` |"
            echo "| Throwaway certificate SHA-256 | \`$CERT_SHA256\` |"
          } >> "$GITHUB_STEP_SUMMARY"
