name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Every job declares the least it needs (ADR 0007).
permissions: {}

# A new push to a pull request stops the run for the one before. Every other run goes on to the
# end: a deploy stopped halfway would leave some apps on the new commit and some on the old. The
# deploy jobs take turns instead (below).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # pnpm at the version that package.json's packageManager pins, which Corepack checks against
      # the SHA-512 there, as pnpm/action-setup does not.
      - run: corepack enable pnpm
      # Once more, now that there is pnpm, for its store from the cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check

  # The end-to-end tests, in six jobs at once: each browser's projects, in two halves. One job
  # running them all took 19 minutes, and each app adds about 5.
  e2e-part:
    name: End-to-end (${{ matrix.browser }} ${{ matrix.part }}/2)
    runs-on: ubuntu-24.04
    # Each app's tests run after the last one's, and installing the browser can take two tries of
    # up to 10 minutes (below).
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Every part reports, so that one failure hides no other.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      # pnpm at the version that package.json's packageManager pins, which Corepack checks against
      # the SHA-512 there, as pnpm/action-setup does not.
      - run: corepack enable pnpm
      # Once more, now that there is pnpm, for its store from the cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The browser build that matches the pinned Playwright version, with its system libraries.
      # Not Chromium's headless shell, so that no test can run on it instead of the whole browser.
      # It takes about a minute. But GitHub's Azure mirror of Ubuntu, which the runner uses first,
      # sometimes stalls, or crawls at 0.1 MB/s while WebKit needs 115 MB: a try that has not
      # finished in 10 minutes stops, and a second one, which keeps what the first downloaded,
      # goes to Ubuntu's own archive.
      - run: |
          for try in 1 2; do
            if timeout --kill-after=1m 10m pnpm --filter @shkriuss/hub exec playwright install --with-deps --no-shell "$BROWSER"; then
              exit 0
            fi
            echo "::warning::Installing $BROWSER failed or took over 10 minutes, on try $try of 2."
            # Playwright runs apt-get as root, through sudo, which the signal that stops a try does
            # not reach. Left running, it and the dpkg that it runs would keep the next try locked
            # out of the package system.
            sudo pkill --signal KILL --exact 'apt-get|dpkg' || true
            timeout 30s sh -c "while pgrep --exact 'apt-get|dpkg' > /dev/null; do sleep 1; done" || true
            # The runner's list of Ubuntu mirrors, without the Azure one.
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt || true
            # A try stopped while dpkg was unpacking leaves packages half installed, and apt-get
            # then refuses to install anything until they are finished, as in CI run 150. With
            # nothing to finish, both do nothing.
            sudo DEBIAN_FRONTEND=noninteractive dpkg --configure -a || true
            sudo DEBIAN_FRONTEND=noninteractive apt-get --fix-broken --yes install || true
          done
          exit 1
        env:
          BROWSER: ${{ matrix.browser }}
      # pnpm e2e, for the projects whose name starts with the browser's (@shkriuss/config), and
      # half of their tests.
      - run: pnpm exec turbo run e2e --concurrency=1 -- --project="$BROWSER-*" --shard="$PART/2"
        env:
          BROWSER: ${{ matrix.browser }}
          PART: ${{ matrix.part }}

  # The check that the main branch's ruleset requires, and that the deployments wait for: it
  # passes once every part has. It runs when a part fails too, as a skipped check would pass.
  e2e:
    name: End-to-end
    needs: [e2e-part]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.e2e-part.result }}

  # Every merge to main builds every app in apps/, the hub among them, once every check has
  # passed (ADR 0006). The build runs the code of many dependencies, so it runs here, without
  # secrets; the deploy jobs only check its files and run Wrangler.
  build:
    name: Build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e, workflow-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      build: ${{ steps.files.outputs.sha256 }}
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache for what users get, so nothing from a cache can reach them.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # pnpm at the version that package.json's packageManager pins, which Corepack checks against
      # the SHA-512 there, as pnpm/action-setup does not.
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The SHA-256 of every file Wrangler uploads, `_headers` included, as `<app>/<file>`: the
      # deploy jobs deploy exactly these files, and the attest job signs where they came from.
      - id: files
        name: Record the hash of every file to deploy
        run: &list-files |
          set -euo pipefail
          export LC_ALL=C
          for app in apps/*/; do
            id="$(basename "$app")"
            (cd "${app}dist" && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sed "s|  \./|  $id/|"
          done | tee "$RUNNER_TEMP/files.txt"
          echo "sha256=$(sha256sum < "$RUNNER_TEMP/files.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          delimiter="$(openssl rand -hex 16)"
          { echo "files<<$delimiter"; cat "$RUNNER_TEMP/files.txt"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: apps/*/dist
          # Every app serves /.well-known/security.txt.
          include-hidden-files: true
          if-no-files-found: error

  # A second build, on another runner, must give the same files byte for byte, so that anyone
  # who builds the commit can compare what the sites serve with what this repository builds.
  reproduce:
    name: Reproduce the build
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # pnpm at the version that package.json's packageManager pins, which Corepack checks against
      # the SHA-512 there, as pnpm/action-setup does not.
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: files
        name: List the files of this build
        run: *list-files
      - name: Check that this build is the one to deploy
        env:
          BUILD: ${{ needs.build.outputs.build }}
          REBUILD: ${{ steps.files.outputs.sha256 }}
        run: |
          if [ "$REBUILD" != "$BUILD" ]; then
            echo "::error::This build differs from the one to deploy. Compare the file hashes listed in both jobs."
            exit 1
          fi

  deploy-staging:
    name: Deploy to staging
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # One deploy at a time, each to the end. Of those that wait, only the latest stays queued.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    environment:
      name: staging
      url: https://shkriuss.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # pnpm at the version that package.json's packageManager pins, which Corepack checks against
      # the SHA-512 there, as pnpm/action-setup does not.
      - run: corepack enable pnpm
      # For Wrangler. Installing runs no package's scripts (allowBuilds in pnpm-workspace.yaml),
      # and nothing is built here.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: apps
      - id: files
        name: List the files to deploy
        run: *list-files
      - name: Check that they are the files that the build recorded
        env:
          BUILD: ${{ needs.build.outputs.build }}
          LISTED: ${{ steps.files.outputs.sha256 }}
        run: &check-files |
          if [ "$LISTED" != "$BUILD" ]; then
            echo "::error::These files differ from those that the build job recorded. Compare the file hashes listed in both jobs."
            exit 1
          fi
      - name: Deploy every app
        run: |
          set -euo pipefail
          for app in apps/*/; do
            pnpm --dir "$app" exec wrangler deploy --env staging
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # Signs the build provenance of every file staging received: the workflow, commit and run that
  # built it (ADR 0007). This job runs no code from the repository or its dependencies, so
  # nothing else can use its signing identity.
  attest:
    name: Attest build provenance
    needs: [build, deploy-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # to get a short-lived Sigstore signing certificate for this workflow
      attestations: write # to store the attestation with the repository
    steps:
      - name: List the files to attest
        env:
          FILES: ${{ needs.build.outputs.files }}
        run: |
          if [ -z "$FILES" ]; then
            echo "::error::The build job listed no files to attest."
            exit 1
          fi
          printf '%s\n' "$FILES" > "$RUNNER_TEMP/subjects.txt"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt

  # The same files go to production once a second build has reproduced them, their provenance
  # is attested, and the maintainer approves the production environment.
  deploy-production:
    name: Deploy to production
    needs: [build, reproduce, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    # As for staging: one at a time, each to the end, and of those that wait, only the latest.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://shkriuss.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # pnpm at the version that package.json's packageManager pins, which Corepack checks against
      # the SHA-512 there, as pnpm/action-setup does not.
      - run: corepack enable pnpm
      # As for staging: for Wrangler, with no package's scripts, and nothing built.
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: apps
      - id: files
        name: List the files to deploy
        run: *list-files
      - name: Check that they are the files that the build recorded
        env:
          BUILD: ${{ needs.build.outputs.build }}
          LISTED: ${{ steps.files.outputs.sha256 }}
        run: *check-files
      # Each app against its own production domain, from its wrangler.json; `jq -e` fails on an
      # app without one, rather than check a domain that does not exist and so compare nothing.
      # The check uses only Node.js and the repository's code.
      - name: Check that no live asset changes content under the same name
        run: |
          set -euo pipefail
          for app in apps/*/; do
            domain="$(jq -er '.env.production.routes[0].pattern' "${app}wrangler.json")"
            node packages/edge/src/cli.ts check-live "${app}dist" "https://$domain"
          done
      - name: Deploy every app
        run: |
          set -euo pipefail
          for app in apps/*/; do
            pnpm --dir "$app" exec wrangler deploy --env production
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  workflow-audit:
    name: Workflow audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          # Runtime licenses are checked by `pnpm check` against tooling/checks/license-policy.json.
          license-check: false
