# CI: runs every quality gate on each pull request and on main.
# On main, when everything passes, it deploys every site to production.
# Docs: docs/deployment.md and docs/quality.md
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Jobs get no permissions unless they ask for them below.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Cancel outdated PR runs, but never cancel a run on main (it may be deploying).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    # A stuck run stops here. Every check, the build and 700+ browser tests
    # take about 15 to 20 minutes (each new app adds about a minute), so this
    # leaves room for a few more apps. When runs come close to it, see
    # docs/quality.md ("Time limit"): never skip tests to fit (audit J-5).
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Confirm Claude API remains disabled (offline)
        run: python3 -B scripts/test-claude-api-gated.py

      - name: Verify Claude one-request budget (offline)
        run: python3 -B scripts/test-claude-request-budget.py

      - name: Verify Claude budget integration (offline)
        run: python3 -B scripts/test-claude-budget-integration.py

      - name: Verify Claude audit workflow safety (offline)
        run: python3 -B scripts/test-claude-audit-concurrency.py

      - name: Verify Claude API has no unexpected imports (offline)
        run: python3 -B scripts/test-claude-no-network.py

      - name: Verify Claude HTTP request preparation (offline)
        run: python3 -B scripts/test-claude-http-offline.py

      - name: Verify Claude single-attempt transport (offline)
        run: python3 -B scripts/test-claude-transport-offline.py

      - name: Set up
        uses: ./.github/actions/setup

      - name: Grammar's Deep check model, from the cache
        uses: ./.github/actions/deep-check-model
        with:
          save: 'true'

      - name: Formatting (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint, including accessibility rules)
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests (Vitest)
        run: pnpm test

      # The same tests on a computer set to German, so a test that passes
      # only in English (one expecting "1,234" or "2:03 PM") fails here, not
      # on a contributor's computer, where it can look like a money bug
      # (audit 3 J-5).
      - name: Unit tests, in German
        run: pnpm test
        env:
          LANG: de_DE.UTF-8
          LC_ALL: de_DE.UTF-8

      - name: Build every site
        run: pnpm build

      - name: CSP safety and size budgets
        run: pnpm check:dist

      # Playwright's browser is kept between runs, named by Playwright's
      # version, so a check (and so a deploy) doesn't need Playwright's
      # download server once it's cached (audit H-2). Its system libraries
      # still come from Ubuntu's mirrors.
      - name: Find Playwright's version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Browser for end-to-end tests, from the cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browser for end-to-end tests
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end, accessibility, security and offline tests (Playwright)
        run: pnpm test:e2e

      - name: Upload test report (when tests fail)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Big on-demand downloads (Grammar's Deep check model, 381 MB) are left
      # out: they'd fill the free artifact storage. The deploy job makes them
      # again, from the same pinned, checksum-checked files (docs/adr/0012).
      # Files in folders whose names start with a dot (the hub's
      # /.well-known/security.txt) are left out unless include-hidden-files.
      - name: Save the tested build for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            apps/*/dist/
            !apps/*/dist/on-demand/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out code (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned version, checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan every commit for secrets
        run: ./gitleaks git --redact --no-banner --verbose .

      # The version is in .github/zizmor/requirements.txt, where Dependabot
      # updates it; pip refuses a download that doesn't match its hashes.
      - name: Install zizmor (pinned version, hashes checked)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --quiet --require-hashes --no-deps \
            --only-binary :all: -r .github/zizmor/requirements.txt

      # Online, so it also checks that each pinned commit really belongs to its
      # action (a commit from someone's fork would otherwise pass).
      - name: Check the workflows themselves for security problems (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --min-severity medium .github/'

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up
        uses: ./.github/actions/setup

      - name: Check for known high or critical vulnerabilities
        run: pnpm audit --audit-level high

      # pnpm's 7-day wait only applies when it picks versions; CI installs what
      # the lockfile says, so check what a pull request adds to it.
      - name: No package versions under 7 days old in the lockfile
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          node scripts/lockfile-age.ts "origin/$BASE_REF"

  deploy:
    name: Deploy to production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [checks, secrets, audit]
    # The Cloudflare token and the storage code are secrets of the "production"
    # environment, which only main can use (docs/deployment.md). Only the steps
    # that need the token get it.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      # Not a secret: it only says which Cloudflare account to deploy to.
      CLOUDFLARE_ACCOUNT_ID: 29431d9d1143cc458db3ad0598c84302
    steps:
      # Re-running an older run must never put older code back live.
      - name: Deploy only the newest commit on main
        id: newest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Not deployed::A newer commit (${latest:0:7}) is on main. It deploys instead, so this older one doesn't."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out code
        if: steps.newest.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Make sure the Cloudflare token is set up
        if: steps.newest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing secret::Add the CLOUDFLARE_API_TOKEN secret to the production environment. See docs/deployment.md."
            exit 1
          fi

      - name: Set up
        if: steps.newest.outputs.deploy == 'true'
        uses: ./.github/actions/setup
        with:
          # A clean install: never packages a test-only job may have cached.
          cache: 'false'

      - name: Get the tested build
        if: steps.newest.outputs.deploy == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: apps/

      - name: Grammar's Deep check model, from the cache
        if: steps.newest.outputs.deploy == 'true'
        uses: ./.github/actions/deep-check-model

      - name: Add the on-demand downloads (left out of the saved build)
        if: steps.newest.outputs.deploy == 'true'
        run: pnpm -r --filter "./apps/*" --if-present run on-demand-into-dist

      - name: Create storage buckets (if they aren't there yet)
        if: steps.newest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/buckets.ts

      - name: Deploy every site (one at a time)
        if: steps.newest.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # The online photo library's storage code (docs/adr/0016-online-photo-library.md).
          PHOTOS_STORAGE_CODE: ${{ secrets.PHOTOS_STORAGE_CODE }}
        run: pnpm -r --filter "./apps/*" --workspace-concurrency=1 run deploy:production

      - name: Check the live sites
        if: steps.newest.outputs.deploy == 'true'
        run: node scripts/smoke-test.ts
