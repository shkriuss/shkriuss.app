name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Every job declares the least it needs (ADR 0007).
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm check

  # The end-to-end tests, in six jobs at once: each browser's projects, in two halves. One job
  # running them all took 19 minutes, and each app adds about 5.
  e2e-part:
    name: End-to-end (${{ matrix.browser }} ${{ matrix.part }}/2)
    runs-on: ubuntu-24.04
    # Each app's tests run after the last one's, and installing the browser can take two tries of
    # up to 10 minutes (below).
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      # Every part reports, so that one failure hides no other.
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The browser build that matches the pinned Playwright version, with its system libraries.
      # Not Chromium's headless shell, so that no test can run on it instead of the whole browser.
      # It takes about a minute, but Ubuntu's package mirrors are sometimes slow (8½ minutes at
      # worst, so far) and sometimes stall for half an hour: a try that has not finished in 10
      # minutes stops, and a second one starts.
      - run: |
          for try in 1 2; do
            if timeout --kill-after=1m 10m pnpm --filter @shkriuss/hub exec playwright install --with-deps --no-shell "$BROWSER"; then
              exit 0
            fi
            echo "::warning::Installing $BROWSER failed or took over 10 minutes, on try $try of 2."
            # Playwright runs apt-get as root, through sudo, which the signal that stops a try does
            # not reach. Left running, it would keep the package lists locked for the next try.
            sudo pkill --signal KILL --exact apt-get || true
          done
          exit 1
        env:
          BROWSER: ${{ matrix.browser }}
      # pnpm e2e, for the projects whose name starts with the browser's (@shkriuss/config), and
      # half of their tests.
      - run: pnpm exec turbo run e2e --concurrency=1 -- --project="$BROWSER-*" --shard="$PART/2"
        env:
          BROWSER: ${{ matrix.browser }}
          PART: ${{ matrix.part }}

  # The check that the main branch's ruleset requires, and that the deployments wait for: it
  # passes once every part has. It runs when a part fails too, as a skipped check would pass.
  e2e:
    name: End-to-end
    needs: [e2e-part]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.e2e-part.result }}

  # Every merge to main goes to staging once every check has passed (ADR 0006): every app in
  # apps/, the hub among them, each to its own domain.
  deploy-staging:
    name: Deploy to staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e, workflow-audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: staging
      url: https://shkriuss.dev
    outputs:
      build: ${{ steps.build.outputs.sha256 }}
      files: ${{ steps.build.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache when deploying, so nothing from a cache can reach users.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The SHA-256 of every file Wrangler uploads, `_headers` included, as `<app>/<file>`, so
      # that production can check it deploys exactly this build, and the attest job can sign
      # where it came from.
      - id: build
        name: Record the hash of every file to deploy
        run: |
          set -euo pipefail
          export LC_ALL=C
          for app in apps/*/; do
            id="$(basename "$app")"
            (cd "${app}dist" && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sed "s|  \./|  $id/|"
          done | tee "$RUNNER_TEMP/files.txt"
          echo "sha256=$(sha256sum < "$RUNNER_TEMP/files.txt" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          delimiter="$(openssl rand -hex 16)"
          { echo "files<<$delimiter"; cat "$RUNNER_TEMP/files.txt"; echo "$delimiter"; } >> "$GITHUB_OUTPUT"
      - name: Deploy every app
        run: |
          set -euo pipefail
          for app in apps/*/; do
            pnpm --dir "$app" exec wrangler deploy --env staging
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  # Signs the build provenance of every file staging received: the workflow, commit and run that
  # built it (ADR 0007). This job runs no code from the repository or its dependencies, so
  # nothing else can use its signing identity.
  attest:
    name: Attest build provenance
    needs: [deploy-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # to get a short-lived Sigstore signing certificate for this workflow
      attestations: write # to store the attestation with the repository
    steps:
      - name: List the files to attest
        env:
          FILES: ${{ needs.deploy-staging.outputs.files }}
        run: |
          if [ -z "$FILES" ]; then
            echo "::error::The staging job listed no files to attest."
            exit 1
          fi
          printf '%s\n' "$FILES" > "$RUNNER_TEMP/subjects.txt"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.txt

  # The same commit goes to production once its provenance is attested and the maintainer
  # approves the production environment.
  deploy-production:
    name: Deploy to production
    needs: [deploy-staging, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: production
      url: https://shkriuss.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The same list as in deploy-staging.
      - name: Check that production gets exactly the files staging got
        env:
          STAGING_BUILD: ${{ needs.deploy-staging.outputs.build }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          for app in apps/*/; do
            id="$(basename "$app")"
            (cd "${app}dist" && find . -type f -print0 | sort -z | xargs -0 sha256sum) | sed "s|  \./|  $id/|"
          done | tee "$RUNNER_TEMP/files.txt"
          if [ "$(sha256sum < "$RUNNER_TEMP/files.txt" | cut -d ' ' -f 1)" != "$STAGING_BUILD" ]; then
            echo "::error::This build differs from the one deployed to staging. Compare the file hashes listed in both jobs."
            exit 1
          fi
      # Each app against its own production domain, from its wrangler.json; `jq -e` fails on an
      # app without one, rather than check a domain that does not exist and so compare nothing.
      - name: Check that no live asset changes content under the same name
        run: |
          set -euo pipefail
          for app in apps/*/; do
            domain="$(jq -er '.env.production.routes[0].pattern' "${app}wrangler.json")"
            node packages/edge/src/cli.ts check-live "${app}dist" "https://$domain"
          done
      - name: Deploy every app
        run: |
          set -euo pipefail
          for app in apps/*/; do
            pnpm --dir "$app" exec wrangler deploy --env production
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  workflow-audit:
    name: Workflow audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          # Runtime licenses are checked by `pnpm check` against tooling/checks/license-policy.json.
          license-check: false
