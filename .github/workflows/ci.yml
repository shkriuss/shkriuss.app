# Continuous integration for every pull request and every push to main.
# What each job checks, and why, is in docs/development/ci.md.

name: CI

# Read-only token. No job in this workflow needs more.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    # Stops a step at the first failing command, also inside a pipe.
    shell: bash

jobs:
  wrapper:
    # A required check on main, by this name. A pull request that renames
    # it must say so, because the owner must update the repository rules.
    name: Gradle wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: ci-wrapper-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs no project code. Compares the wrapper with what Gradle published
      # for the version named in gradle-wrapper.properties.
      - name: Check the wrapper against Gradle's published checksums
        run: |
          set -u
          props=android/gradle/wrapper/gradle-wrapper.properties
          jar=android/gradle/wrapper/gradle-wrapper.jar

          # 1. The wrapper jar is the only jar in the repository, so a second
          #    wrapper cannot hide under another name.
          mapfile -d '' jars < <(git ls-files -z -- ':(icase)*.jar')
          if [ "${#jars[@]}" -ne 1 ] || [ "${jars[0]}" != "$jar" ]; then
            echo "::error::The only .jar file allowed in the repository is $jar."
            for found in "${jars[@]}"; do printf 'Found: %q\n' "$found"; done
            exit 1
          fi

          # 2. Read the download address and its checksum. Each must appear
          #    exactly once and have the expected form.
          read_property() {
            local values
            mapfile -t values < <(sed -n "s/^$1=//p" "$props")
            if [ "${#values[@]}" -ne 1 ]; then
              echo "::error file=$props::Expected exactly one $1 line."
              exit 1
            fi
            # The properties format writes ':' as '\:'.
            property="${values[0]//\\:/:}"
          }
          read_property distributionUrl
          url="$property"
          read_property distributionSha256Sum
          sum="$property"
          url_pattern='^https://services\.gradle\.org/distributions/gradle-([0-9]+\.[0-9]+(\.[0-9]+)?)-bin\.zip$'
          if ! [[ "$url" =~ $url_pattern ]]; then
            echo "::error file=$props::distributionUrl must be a -bin.zip release on services.gradle.org."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if ! [[ "$sum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error file=$props::distributionSha256Sum must be 64 lower-case hex digits."
            exit 1
          fi

          # 3. Gradle's list of releases holds the official checksums of
          #    every release and its wrapper jar.
          list="$RUNNER_TEMP/gradle-versions.json"
          curl -fsSL --retry 3 --max-time 120 -o "$list" https://services.gradle.org/versions/all
          mapfile -t official < <(jq -r --arg v "$version" '
            [.[] | select(.version == $v and .final and (.snapshot | not) and (.broken | not))]
            | if length == 1 then .[0] | .downloadUrl, .checksum, .wrapperChecksum else empty end
          ' "$list")
          if [ "${#official[@]}" -ne 3 ]; then
            echo "::error file=$props::Gradle $version is not a final, unbroken Gradle release."
            exit 1
          fi

          # 4. Compare all three.
          if [ "$url" != "${official[0]}" ]; then
            echo "::error file=$props::distributionUrl is not Gradle's address for $version."
            exit 1
          fi
          if [ "$sum" != "${official[1]}" ]; then
            echo "::error file=$props::distributionSha256Sum is not Gradle's checksum for $version."
            exit 1
          fi
          jar_sum="$(sha256sum "$jar" | cut -d ' ' -f 1)"
          if [ "$jar_sum" != "${official[2]}" ]; then
            echo "::error file=$jar::The wrapper jar is not the one Gradle $version ships. After changing the version, run the wrapper task a second time."
            exit 1
          fi
          echo "Gradle $version: the wrapper jar, the download address and its checksum match Gradle's published values."

  check:
    # A required check on main, by this name. A pull request that renames
    # it must say so, because the owner must update the repository rules.
    name: Check
    # The build runs ./gradlew, so it waits until the wrapper is checked.
    needs: wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: ci-check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use JDK 21
        run: |
          # GitHub's Ubuntu runners come with JDK 21 installed.
          if [ -z "${JAVA_HOME_21_X64:-}" ]; then
            echo "::error::This runner has no JDK 21."
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # Keep these in step with build-logic (ShkBuild.kt) and the cloud setup
      # script in docs/development/cloud-environment.md.
      - name: Install the Android SDK packages the build pins
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          log="$RUNNER_TEMP/sdkmanager.log"
          set +o pipefail
          if ! yes | "$sdkmanager" --licenses > "$log" 2>&1; then cat "$log"; exit 1; fi
          set -o pipefail
          if ! "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" >> "$log" 2>&1; then cat "$log"; exit 1; fi

      # Gradle's downloads. Only pushes to main save them (the last step), so
      # a pull request can never change what another run restores. Gradle
      # still checks every file against verification-metadata.xml.
      - name: Restore Gradle downloads
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/verification-metadata.xml') }}

      # The release checks are named one by one, for every app. If either
      # check is removed from the build, Gradle cannot find its task and this
      # step fails. If one is turned off, its report is missing and this step
      # fails too. Every app's versionCode must follow from its versionName
      # (ADR 0021), checked with the same script that release.yml uses.
      - name: Unit tests, lint, screenshots and release checks
        working-directory: android
        run: |
          set -u
          apps=()
          for build_file in app/*/build.gradle.kts; do
            [ -e "$build_file" ] || continue
            name="${build_file#app/}"
            name="${name%/build.gradle.kts}"
            if ! [[ "$name" =~ ^[a-z][a-z0-9]*$ ]]; then
              echo "::error::Folder names in android/app/ must be lower-case letters and digits."
              exit 1
            fi
            apps+=("$name")
          done
          if [ "${#apps[@]}" -eq 0 ]; then
            echo "::error::No app found in android/app/."
            exit 1
          fi

          release_checks=()
          for app in "${apps[@]}"; do
            release_checks+=(":app:$app:checkReleaseApkRules" ":app:$app:checkReleaseGraphicsPathUse")
          done

          ./gradlew --no-daemon --console=plain check verifyRoborazziDebug "${release_checks[@]}"

          for app in "${apps[@]}"; do
            for report in "app/$app/build/reports/apk-rules/release.txt" \
                          "app/$app/build/reports/graphics-path-use/release.txt"; do
              if [ ! -s "$report" ]; then
                echo "::error::android/$report was not written. A release check was skipped."
                exit 1
              fi
            done
            echo "Release checks ran for $app."

            # The release checks built the release APK, and its metadata
            # holds the version the build used.
            metadata="app/$app/build/outputs/apk/release/output-metadata.json"
            mapfile -t version < <(jq -r '.elements[] | (.versionName // ""), (.versionCode // "")' "$metadata")
            if [ "${#version[@]}" -ne 2 ]; then
              echo "::error::Expected one release APK with a version in android/$metadata."
              exit 1
            fi
            echo "Version of $app:"
            ../.github/scripts/check-version-code.sh "${version[0]}" "${version[1]}"
          done

      # When a screenshot differs, Roborazzi writes the new image and a
      # comparison image. Download them from the run's summary page.
      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-differences
          path: android/**/build/outputs/roborazzi/
          if-no-files-found: ignore
          overwrite: true

      - name: Save Gradle downloads
        if: github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

  emulator:
    # Runs the instrumented tests on an emulator, once for each Android
    # version. Not a required check: the owner decides that
    # (docs/development/emulator-tests.md). No action starts the emulator.
    # The steps below call the SDK's own tools.
    name: Emulator (Android ${{ matrix.android }})
    # The build runs ./gradlew, so it waits until the wrapper is checked.
    needs: wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      # One Android version that fails must not hide what the others say.
      fail-fast: false
      matrix:
        include:
          # AOSP images only: "default" has no Google apps and no Play
          # services (hard rule 3). Android 13 is the minimum, 17 the newest.
          - android: "13"
            image: "system-images;android-33;default;x86_64"
          - android: "14"
            image: "system-images;android-34;default;x86_64"
          - android: "15"
            image: "system-images;android-35;default;x86_64"
          - android: "17"
            image: "system-images;android-37.0;default;x86_64"
    concurrency:
      group: ci-emulator-${{ matrix.android }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      IMAGE: ${{ matrix.image }}
      ANDROID_VERSION: ${{ matrix.android }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use JDK 21
        run: |
          # GitHub's Ubuntu runners come with JDK 21 installed.
          if [ -z "${JAVA_HOME_21_X64:-}" ]; then
            echo "::error::This runner has no JDK 21."
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"

      # The first two packages are the ones the build pins, as in "Check".
      # The others are the emulator, adb and this job's system image.
      - name: Install the Android SDK packages, the emulator and the system image
        run: |
          set -u
          if ! [[ "$IMAGE" =~ ^system-images\;android-[0-9.]+\;default\;x86_64$ ]]; then
            echo "::error::Only AOSP images are allowed: system-images;android-<level>;default;x86_64."
            exit 1
          fi
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          log="$RUNNER_TEMP/sdkmanager.log"
          set +o pipefail
          if ! yes | "$sdkmanager" --licenses > "$log" 2>&1; then cat "$log"; exit 1; fi
          set -o pipefail
          if ! "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "platform-tools" "emulator" "$IMAGE" >> "$log" 2>&1; then
            cat "$log"
            exit 1
          fi
          # Written down in the log: the emulator and the image have no
          # version in their package names.
          "$sdkmanager" --list_installed 2>/dev/null | grep -E '^ *(emulator|platform-tools|system-images)' || true

      # GitHub's Linux runners have KVM, but the runner's user may not use
      # it until this rule is added.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Restored only, never saved here. See the job "Check".
      - name: Restore Gradle downloads
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-${{ runner.os }}-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/verification-metadata.xml') }}

      # A module has instrumented tests if it has a folder src/androidTest.
      # Folder names come from the pull request, so they are matched
      # against a fixed pattern before they become a task name.
      - name: Build the test APKs
        working-directory: android
        run: |
          set -u
          tasks=()
          while IFS= read -r -d '' folder; do
            module="${folder#./}"
            module="${module%/src/androidTest}"
            if ! [[ "$module" =~ ^[a-z][a-z0-9-]*(/[a-z][a-z0-9-]*)*$ ]]; then
              echo "::error::A module with instrumented tests has an unexpected path."
              exit 1
            fi
            tasks+=(":${module//\//:}:assembleDebugAndroidTest")
          done < <(find . -type d -path '*/src/androidTest' -not -path '*/build/*' -print0 | sort -z)
          if [ "${#tasks[@]}" -eq 0 ]; then
            echo "::error::No module has instrumented tests."
            exit 1
          fi

          ./gradlew --no-daemon --console=plain "${tasks[@]}"

          mkdir "$RUNNER_TEMP/test-apks"
          number=0
          while IFS= read -r -d '' apk; do
            number=$((number + 1))
            cp "$apk" "$RUNNER_TEMP/test-apks/$number.apk"
          done < <(find . -type f -path '*/build/outputs/apk/androidTest/debug/*.apk' -print0 | sort -z)
          if [ "$number" -ne "${#tasks[@]}" ]; then
            echo "::error::Expected ${#tasks[@]} test APKs and found $number."
            exit 1
          fi
          echo "Built $number test APKs."

      # The emulator keeps running after this step, until the job ends.
      - name: Start the emulator
        run: |
          set -u
          adb="$ANDROID_HOME/platform-tools/adb"
          # One folder for the emulator's files, named to both tools. Left to
          # themselves, avdmanager and the emulator look in different places
          # on this runner.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name test --package "$IMAGE" > /dev/null
          # More memory than the default, and a hardware keyboard, so that no
          # on-screen keyboard covers what the tests type into.
          printf 'hw.ramSize=4096\nhw.keyboard=yes\n' >> "$ANDROID_AVD_HOME/test.avd/config.ini"

          # -no-window starts the emulator's windowless program. The one with
          # a window needs a sound library that the runner does not have.
          nohup "$ANDROID_HOME/emulator/emulator" -avd test \
            -no-window -no-audio -no-boot-anim -no-snapshot -no-metrics \
            -gpu swiftshader_indirect -camera-back none -camera-front none \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &

          if ! timeout 300 "$adb" wait-for-device; then
            echo "::error::The emulator did not appear in 5 minutes."
            exit 1
          fi
          deadline=$((SECONDS + 900))
          until [ "$("$adb" shell getprop sys.boot_completed 2> /dev/null | tr -d '\r')" = "1" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Android $ANDROID_VERSION did not start in 15 minutes."
              exit 1
            fi
            sleep 5
          done
          # The package manager answers a little after the start is reported.
          until "$adb" shell pm path android > /dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The package manager did not answer."
              exit 1
            fi
            sleep 5
          done

          # No animations, the screen stays on, and the emulator is unlocked.
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            "$adb" shell settings put global "$scale" 0
          done
          "$adb" shell svc power stayon true
          "$adb" shell input keyevent KEYCODE_WAKEUP
          "$adb" shell wm dismiss-keyguard
          echo "Android $("$adb" shell getprop ro.build.version.release | tr -d '\r'), API $("$adb" shell getprop ro.build.version.sdk | tr -d '\r'), $("$adb" shell getprop ro.build.fingerprint | tr -d '\r')"

      # "am instrument" ends without an error also when a test fails. So
      # the runner in core/testing writes one last line, and only that line
      # counts.
      - name: Run the instrumented tests
        run: |
          set -u
          adb="$ANDROID_HOME/platform-tools/adb"
          for apk in "$RUNNER_TEMP"/test-apks/*.apk; do
            "$adb" install -r -t "$apk" > /dev/null
          done

          runner_pattern='^instrumentation:(app\.shkriuss\.[a-z0-9.]+\.test/app\.shkriuss\.core\.testing\.InstrumentedTestRunner) '
          runs=0
          failed=0
          while IFS= read -r line; do
            if ! [[ "$line" =~ $runner_pattern ]]; then continue; fi
            component="${BASH_REMATCH[1]}"
            runs=$((runs + 1))
            output="$RUNNER_TEMP/tests-$runs.txt"
            echo "::group::$component"
            timeout 1500 "$adb" shell am instrument -w "$component" < /dev/null | tr -d '\r' | tee "$output" || true
            echo "::endgroup::"
            if [ "$(grep -c -x 'INSTRUMENTED_TESTS_PASSED' "$output")" -ne 1 ]; then
              echo "::error::Instrumented tests failed on Android $ANDROID_VERSION: $component"
              grep -E '^(FAIL|NOTE) ' "$output" || true
              failed=1
            else
              grep -E '^(SKIP|NOTE) ' "$output" || true
            fi
          done < <("$adb" shell pm list instrumentation | tr -d '\r' | sort)

          apks=("$RUNNER_TEMP"/test-apks/*.apk)
          if [ "$runs" -ne "${#apks[@]}" ]; then
            echo "::error::Installed ${#apks[@]} test APKs, but $runs of them use the project's test runner."
            exit 1
          fi
          exit "$failed"

      - name: Collect the logs
        if: failure()
        run: |
          adb="$ANDROID_HOME/platform-tools/adb"
          mkdir -p "$RUNNER_TEMP/emulator-logs"
          cp "$RUNNER_TEMP"/emulator.log "$RUNNER_TEMP"/tests-*.txt "$RUNNER_TEMP/emulator-logs/" 2> /dev/null || true
          timeout 60 "$adb" logcat -d > "$RUNNER_TEMP/emulator-logs/logcat.txt" 2> /dev/null || true
          timeout 60 "$adb" exec-out screencap -p > "$RUNNER_TEMP/emulator-logs/screen.png" 2> /dev/null || true
          # The crashes and the test runner's own lines, to read without a download.
          echo "::group::Crashes and test lines in Android's log"
          grep -a -E ' (AndroidRuntime|InstrumentedTests|DEBUG|libc) *:' "$RUNNER_TEMP/emulator-logs/logcat.txt" | tail -n 250 || true
          echo "::endgroup::"

      # The test output, the emulator's own log, Android's log and a picture
      # of the screen. Download them from the run's summary page.
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-logs-android-${{ matrix.android }}
          path: ${{ runner.temp }}/emulator-logs/
          if-no-files-found: ignore
          overwrite: true
