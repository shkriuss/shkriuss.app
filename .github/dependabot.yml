# Dependabot: opens pull requests to keep dependencies and GitHub Actions up
# to date. CI must pass before you merge them.
version: 2
updates:
  - package-ecosystem: npm # also handles pnpm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week after a release, so broken or malicious versions are
    # usually caught by others first. Keep this equal to minimumReleaseAge in
    # pnpm-workspace.yaml (10080 minutes), or Dependabot's updates fail.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # One PR for all minor and patch updates, so there's less to review.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node.js's types must match the Node.js we run (24 LTS, see .node-version).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # TypeScript 7 isn't supported by our lint and type-check tools yet.
      # See docs/adr/0005-pnpm-typescript-versions.md for when to upgrade.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
