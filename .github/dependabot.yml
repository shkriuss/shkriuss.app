version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Let new releases age before they are proposed; security updates are not delayed.
    cooldown:
      default-days: 7
    # Patches come together. A minor version comes alone: for packages still at 0.x, such as
    # age-encryption, it may break things.
    groups:
      patches:
        update-types: [patch]
    ignore:
      # The Node.js types follow the Node.js major version in .node-version; raise both together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(ci)
