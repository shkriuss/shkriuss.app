packages:
  - apps/*
  - packages/*
  - tooling/*

# One version of every dependency for the whole repository (ADR 0002).
# Every package.json refers to these with "catalog:"; `pnpm check` enforces it.
catalog:
  "@axe-core/playwright": 4.13.0
  "@playwright/test": 1.63.0
  "@types/node": 24.19.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.1
  "@vitest/coverage-v8": 5.0.3
  age-encryption: 0.3.1
  dexie: 4.4.6
  fake-indexeddb: 6.2.5
  fast-check: 4.10.2
  markdownlint: 0.41.1
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  prettier: 3.9.9
  react: 19.3.0
  react-dom: 19.3.0
  turbo: 2.11.6
  typescript: 7.0.2
  vite: 8.3.2
  vitest: 5.0.3
  wrangler: 4.146.0

# Supply-chain hardening (ADR 0007).
# Never install a version published less than 3 days ago. For an urgent security
# fix, list the package in minimumReleaseAgeExclude with a comment, and remove it
# again once the release is old enough.
minimumReleaseAge: 4320
minimumReleaseAgeExclude: []
# Refuse a release that is less trustworthy (e.g. lost its provenance) than earlier ones.
trustPolicy: no-downgrade
# Refuse git and tarball URLs deep in the dependency tree.
blockExoticSubdeps: true
# Install scripts are blocked; installs fail until a package is reviewed and listed here.
strictDepBuilds: true
allowBuilds:
  # Both ship their binary in a platform package (@esbuild/*, @cloudflare/workerd-*) and
  # run it through a small JavaScript launcher. Their install scripts only swap in the
  # binary for speed or download it when that package is missing, so they stay off.
  esbuild: false
  workerd: false
engineStrict: true
savePrefix: ""
