# pnpm workspace: every folder listed here is a package in the monorepo.
packages:
  - apps/*
  - packages/*

# One place for third-party versions. Packages use "catalog:" instead of a
# version number, so upgrading Astro (for example) is a one-line change here.
catalog:
  '@astrojs/check': ^0.9.10
  '@axe-core/playwright': ^4.14.0
  '@eslint/js': ^10.0.1
  '@playwright/test': ^1.64.1
  '@types/node': ^24.19.0
  # Reads every built script as ES2022, what Safari 16.4 runs (check:dist,
  # audit 4 J-3). Already there for ESLint.
  acorn: ^8.19.0
  astro: ^7.4.0
  eslint: ^10.13.0
  eslint-plugin-astro: ^3.2.1
  eslint-plugin-jsx-a11y-x: ^0.2.0
  globals: ^17.13.0
  # Grammar's checker: runs on the device as WebAssembly (docs/adr/0011).
  harper.js: ^2.13.0
  # Grammar's Deep check: runs its AI model on the device (docs/adr/0012).
  onnxruntime-web: ^1.30.0
  prettier: ^3.9.10
  prettier-plugin-astro: ^1.1.0
  sharp: ^0.35.5
  # TypeScript 7 is out, but typescript-eslint and @astrojs/check still need 6.x.
  typescript: ~6.0.3
  typescript-eslint: ^8.71.2
  vitest: ^5.0.5
  wrangler: ^4.151.1
  # Reads pnpm-lock.yaml and the workflows as YAML, the way pnpm and GitHub
  # read them (scripts/lockfile-age.ts, audit 5 H-1; tests/unit/workflows.test.ts).
  # Already there for Astro.
  yaml: ^2.9.1

# Supply-chain safety: only these dependencies may run install scripts
# (pnpm blocks all others), and an unexpected one fails the install.
onlyBuiltDependencies:
  - esbuild
  - workerd
# Install scripts we don't need, skipped on purpose (protobufjs's only prints
# a version warning).
ignoredBuiltDependencies:
  - protobufjs
strictDepBuilds: true

# Security fixes Dependabot can't make, for packages only another package
# uses (docs/quality.md). Remove each once that package needs the fixed
# version itself.
overrides:
  # undici: GHSA-xjj6-f33q-929c (high), GHSA-4qv8-2p9j-2685, GHSA-f72v-6w45-q472.
  # miniflare (inside wrangler: local servers and tests only) pins 7.29.1;
  # unifont (Astro's fonts, while building) allows any 8.x.
  'miniflare>undici': 7.30.1
  'unifont>undici': ^8.12.2
  # fast-uri: GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr (moderate),
  # GHSA-xhq7-xmqj-769h, GHSA-333x-w4r6-6crp (low), fixed in 3.1.9. Only ajv
  # uses it, inside @astrojs/check's language server (the type check, never
  # a page or a Worker); ajv allows any 3.x (audit 5 Z-5).
  'fast-uri': ^3.1.9

# Don't install versions published less than 7 days ago, so a hijacked or
# broken release is usually caught and pulled before it reaches us. This must
# match Dependabot's cooldown (.github/dependabot.yml): Dependabot applies its
# cooldown to the whole lockfile, so a younger package here makes it fail.
# For an urgent security fix, list the package under minimumReleaseAgeExclude,
# in a pull request of its own, merged first: the check on pull requests
# (scripts/lockfile-age.ts) reads this list from main (audit 4 H-1).
minimumReleaseAge: 10080
