# pnpm workspace: every folder listed here is a package in the monorepo.
packages:
  - apps/*
  - packages/*

# One place for third-party versions. Packages use "catalog:" instead of a
# version number, so upgrading Astro (for example) is a one-line change here.
catalog:
  '@astrojs/check': ^0.9.10
  '@axe-core/playwright': ^4.13.0
  '@eslint/js': ^10.0.1
  '@playwright/test': ^1.64.0
  '@types/node': ^24.19.0
  astro: ^7.3.8
  eslint: ^10.12.0
  eslint-plugin-astro: ^3.2.1
  eslint-plugin-jsx-a11y-x: ^0.2.0
  globals: ^17.13.0
  # Grammar's checker: runs on the device as WebAssembly (docs/adr/0011).
  harper.js: ^2.10.0
  # Grammar's Deep check: runs its AI model on the device (docs/adr/0012).
  onnxruntime-web: ^1.30.0
  prettier: ^3.9.10
  prettier-plugin-astro: ^1.1.0
  sharp: ^0.35.5
  # TypeScript 7 is out, but typescript-eslint and @astrojs/check still need 6.x.
  typescript: ~6.0.3
  typescript-eslint: ^8.71.0
  vitest: ^5.0.4
  wrangler: ^4.149.0

# Supply-chain safety: only these dependencies may run install scripts
# (pnpm blocks all others), and an unexpected one fails the install.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
# Install scripts we don't need, skipped on purpose (protobufjs's only prints
# a version warning).
ignoredBuiltDependencies:
  - protobufjs
strictDepBuilds: true

# Don't install versions published less than 7 days ago, so a hijacked or
# broken release is usually caught and pulled before it reaches us. This must
# match Dependabot's cooldown (.github/dependabot.yml): Dependabot applies its
# cooldown to the whole lockfile, so a younger package here makes it fail.
# For an urgent security fix, list the package under minimumReleaseAgeExclude.
minimumReleaseAge: 10080
