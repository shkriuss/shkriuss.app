packages:
  - apps/*
  - packages/*
  - tooling/*

# One version of every dependency for the whole repository (ADR 0002).
# Every package.json refers to these with "catalog:"; `pnpm check` enforces it.
catalog:
  "@types/node": 24.19.0
  markdownlint-cli2: 0.23.3
  oxlint: 1.86.0
  oxlint-tsgolint: 7.0.2003
  prettier: 3.9.9
  turbo: 2.11.6
  typescript: 7.0.2
  vitest: 5.0.3

# Supply-chain hardening (ADR 0007).
# Never install a version published less than 3 days ago. For an urgent security
# fix, list the package in minimumReleaseAgeExclude with a comment, and remove it
# again once the release is old enough.
minimumReleaseAge: 4320
minimumReleaseAgeExclude: []
# Refuse a release that is less trustworthy (e.g. lost its provenance) than earlier ones.
trustPolicy: no-downgrade
# Refuse git and tarball URLs deep in the dependency tree.
blockExoticSubdeps: true
# Install scripts are blocked; installs fail until a package is reviewed and listed here.
strictDepBuilds: true
allowBuilds: {}
engineStrict: true
savePrefix: ""
